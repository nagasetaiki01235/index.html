<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>課題ノート</title><meta name="description" content="大学の課題を締切順に整理する課題ノート。操作体験版。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232458d3'/%3E%3Cpath d='m8 16 5 5 11-12' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#15233e;font-family:system-ui,sans-serif;font-size:16px;line-height:1.7}.wrap{max-width:1100px;margin:auto;padding:32px 24px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:38px}.brand{font-weight:800;font-size:22px}.brand b{display:inline-block;background:#2458d3;color:white;padding:2px 12px;border-radius:9px;margin-right:12px}.tag{font-size:14px;color:#526582}h1{font-size:clamp(28px,4vw,40px);margin:6px 0 16px;letter-spacing:-.04em}h2{font-size:20px;margin:0}.note{background:#e7edfc;padding:16px 20px;border-left:4px solid #2458d3;border-radius:8px;margin-bottom:26px}.stats{display:flex;gap:32px;margin:28px 0}.stats strong{font-size:32px;margin-right:8px}.stats span{font-size:14px;color:#526582}.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:26px;align-items:start}.panel{background:white;border:1px solid #dce2ec;border-radius:14px;overflow:hidden}.heading{padding:22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e5eaf1}.form{padding:24px}label{display:block;margin:16px 0 6px;font-size:14px;font-weight:650}input,select{font:inherit;width:100%;padding:11px;border:1px solid #b7c4da;border-radius:7px;background:white}input:focus,select:focus,button:focus-visible{outline:3px solid #8ba9ef;outline-offset:2px}button{font:inherit;cursor:pointer}.primary{border:0;border-radius:8px;background:#2458d3;color:white;padding:12px;width:100%;margin-top:22px;font-weight:700}.task{display:flex;gap:16px;align-items:center;padding:22px;border-bottom:1px solid #e5eaf1}.task:last-child{border:0}.task input{width:24px;height:24px;flex-shrink:0;accent-color:#2458d3}.text{min-width:0;flex:1}.course{font-size:14px;color:#2458d3}.title{font-weight:650;overflow-wrap:anywhere;margin:4px 0}.due{font-size:14px;color:#526582}.late{color:#b42318}.done .title{text-decoration:line-through;color:#66758f}.empty{text-align:center;padding:52px 20px;color:#526582}.empty strong{display:block;color:#15233e;margin-bottom:8px}footer{font-size:14px;color:#526582;margin-top:24px}#status{min-height:24px;font-size:14px;color:#2458d3}
.secondary{border:1px solid #b7c4da;background:white;color:#2458d3;border-radius:7px;padding:9px 12px;margin-top:10px}.hint{font-size:14px;color:#526582;margin:8px 0}.course-registration{border-bottom:1px solid #e5eaf1;padding-bottom:20px;margin-bottom:20px}button:disabled{opacity:.5;cursor:not-allowed}
@media(max-width:740px){.grid{grid-template-columns:1fr}.form{grid-row:1}.wrap{padding:24px 16px}.stats{gap:18px}.stats strong{font-size:27px}.tag{max-width:110px;text-align:right}}
</style></head><body><main class="wrap"><header><div class="brand"><b aria-hidden="true">✓</b>課題ノート</div><span class="tag">操作体験版</span></header><h1>課題を、ひとつずつ。</h1><div class="note"><strong>まずは使い心地を試してみよう。</strong><br>この体験版の授業・課題は保存されません。ページを再読み込みすると消えます。ログイン・スマホとPCの同期は準備中です。</div><div class="stats"><div><strong id="pending">0</strong><span>未提出</span></div><div><strong id="done">0</strong><span>提出済み</span></div><div><strong id="late">0</strong><span>締切超過</span></div></div><div class="grid"><section class="panel" aria-label="課題一覧"><div class="heading"><h2>課題一覧</h2><span class="tag">締切が近い順</span></div><div id="list"></div></section><section class="panel form"><div class="course-registration"><h2>授業を登録</h2><p class="hint">必要な授業だけでOK。あとから追加できます。</p><form id="course-form"><label for="new-course">新しい授業名</label><input id="new-course" maxlength="100" required placeholder="例：構造力学"><button class="secondary" type="submit">＋ 授業を登録</button></form></div><h2>課題を追加</h2><form id="form"><label for="course">授業を選択</label><select id="course" required aria-describedby="course-hint"></select><p class="hint" id="course-hint">まず上の欄で授業を登録してください。</p><button class="secondary" id="add-course" type="button">＋ 未登録の授業を追加</button><label for="title">課題名</label><input id="title" maxlength="200" required placeholder="例：第1回 演習レポート"><label for="due">締切日</label><input id="due" type="date" min="2000-01-01" max="2100-12-31" required><button id="add-task" class="primary">＋ 課題を追加</button></form><p id="status" role="status"></p></section></div><footer>提出したら、課題の左にチェック。</footer></main><script>
'use strict';
const tasks=[];const courses=[];const $=id=>document.getElementById(id);
function renderCourses(selected=''){
$('course').replaceChildren();
const placeholder=document.createElement('option');placeholder.value='';placeholder.textContent=courses.length?'授業を選んでください':'授業が未登録です';$('course').append(placeholder);
courses.forEach(name=>{const option=document.createElement('option');option.value=name;option.textContent=name;$('course').append(option);});
$('course').value=selected;$('course').disabled=!courses.length;$('add-task').disabled=!courses.length;
$('course-hint').textContent=courses.length?'登録した授業から選べます。':'まず上の欄で授業を登録してください。';
}
$('add-course').onclick=()=>{$('new-course').focus();};
$('course-form').onsubmit=e=>{
e.preventDefault();const name=$('new-course').value.trim().replace(/\s+/g,' ');
if(!name){$('status').textContent='授業名を入力してください。';$('new-course').focus();return;}
const existing=courses.find(c=>c.normalize('NFKC').toLocaleLowerCase()===name.normalize('NFKC').toLocaleLowerCase());
if(!existing)courses.push(name);
renderCourses(existing||name);$('new-course').value='';$('title').focus();
$('status').textContent=existing?'登録済みの授業を選択しました。':'授業を登録しました。この授業の課題を追加できます。';
};
function render(){
const today=new Intl.DateTimeFormat('sv-SE').format(new Date());
$('pending').textContent=tasks.filter(t=>!t.done).length;
$('done').textContent=tasks.filter(t=>t.done).length;
$('late').textContent=tasks.filter(t=>!t.done&&t.due<today).length;
$('list').replaceChildren();
if(!tasks.length){const div=document.createElement('div');div.className='empty';const strong=document.createElement('strong');strong.textContent='まだ課題はありません';div.append(strong,document.createTextNode('最初の課題を登録してみよう。'));$('list').append(div);return;}
[...tasks].sort((a,b)=>Number(a.done)-Number(b.done)||a.due.localeCompare(b.due)).forEach(t=>{
const article=document.createElement('article');article.className='task'+(t.done?' done':'');
const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=t.done;checkbox.setAttribute('aria-label',t.title+'を'+(t.done?'未提出':'提出済み')+'にする');
checkbox.onchange=()=>{t.done=checkbox.checked;render();document.getElementById('task-'+t.id)?.focus();$('status').textContent=t.done?'提出済みにしました。':'未提出に戻しました。';};checkbox.id='task-'+t.id;
const text=document.createElement('div');text.className='text';
for(const [className,value] of [['course',t.course],['title',t.title],['due'+(!t.done&&t.due<today?' late':''),t.due.replaceAll('-',' / ')+(t.done?' · 提出済み':t.due<today?' · 締切超過':t.due===today?' · 今日が締切':'')]]){const el=document.createElement('div');el.className=className;el.textContent=value;text.append(el);}
article.append(checkbox,text);$('list').append(article);});
}
$('form').onsubmit=e=>{e.preventDefault();const course=$('course').value.trim(),title=$('title').value.trim(),due=$('due').value;if(!courses.includes(course)||!title||!due){$('status').textContent='授業名と課題名を入力してください。';return;}tasks.push({id:crypto.randomUUID(),course,title,due,done:false});render();$('title').value='';$('due').value='';$('title').focus();$('status').textContent='体験用の課題を追加しました。';};
window.addEventListener('beforeunload',e=>{if(tasks.length||courses.length){e.preventDefault();e.returnValue='';}});
renderCourses();render();
</script></body></html>
